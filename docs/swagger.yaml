        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_faridlan_sikon-api_internal_utils.ErrorResponse'
      summary: List Payments
      tags:
      - Payments
    post:
      consumes:
      - application/json
      description: Memproses pembayaran (DP/Lunas) untuk sebuah pesanan. <br><br>
        **PENTING UNTUK FE:** <br> 1. Otomatis mengubah `payment_status` pada Order
        menjadi `partial` atau `paid`. (Tidak perlu hit API update status lagi). <br>
        2. Sistem akan menolak (HTTP 400) jika nominal bayar melebihi sisa tagihan
        (Anti-Overpayment). <br> 3. Endpoint ini sudah dilindungi kunci database (Pessimistic
        Locking) sehingga aman dari *double submit* (Race Condition).
      parameters:
      - description: Data Pembayaran
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_faridlan_sikon-api_internal_delivery_http_dto.PaymentCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
