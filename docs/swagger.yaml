        berubah secara OTOMATIS saat kasir melakukan transaksi di endpoint `/api/payments`.
        Endpoint ini hanya digunakan untuk *Manual Override* oleh Super Admin jika
        terjadi anomali sistem.'
      parameters:
      - description: Order ID (UUID)
        in: path
        name: id
        required: true
        type: string
