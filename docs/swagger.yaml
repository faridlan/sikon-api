host: localhost:8080
info:
  contact: {}
  description: Ini adalah dokumentasi API untuk MVP ERP SIKOn.
  title: SIKOn API (Sistem Integrasi Konveksi Online)
  version: "1.0"
paths:
  /bank-accounts:
    get:
      description: Mengambil daftar seluruh rekening bank
      parameters:
      - default: 1
        description: Nomor Halaman
        in: query
        name: page
        type: integer
      - default: 10
        description: Batas Data per Halaman
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_faridlan_sikon-api_internal_utils.PaginatedResponse-github_com_faridlan_sikon-api_internal_delivery_http_dto_BankAccountResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_faridlan_sikon-api_internal_utils.ErrorResponse'
      summary: List All Bank Accounts
      tags:
      - Bank Accounts
    post:
      consumes:
      - application/json
      description: Menambahkan rekening bank (Perusahaan / Sales)
      parameters:
      - description: Data Rekening Baru
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_faridlan_sikon-api_internal_delivery_http_dto.BankAccountCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_faridlan_sikon-api_internal_utils.SuccessResponse-github_com_faridlan_sikon-api_internal_delivery_http_dto_BankAccountResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_faridlan_sikon-api_internal_utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_faridlan_sikon-api_internal_utils.ErrorResponse'
      summary: Create Bank Account
      tags:
      - Bank Accounts
  /bank-accounts/{id}:
    delete:
      description: Menghapus rekening secara permanen
      parameters:
      - description: Bank Account ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_faridlan_sikon-api_internal_utils.SuccessResponse-github_com_faridlan_sikon-api_internal_utils_EmptyObj'
        "400":
