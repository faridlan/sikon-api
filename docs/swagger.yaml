  /orders/{id}/status:
    patch:
      consumes:
      - application/json
      description: 'Mengubah status operasional pabrik. Tunduk pada aturan validasi
        State Machine: <br><br> 1. **quotation** -> **pending** <br> 2. **pending**
        -> **production** *(Syarat: Minimal sudah bayar DP / status partial)* <br>
        3. **production** -> **completed** *(Syarat: Status pembayaran harus lunas/paid)*
        <br> 4. **canceled** *(Syarat: Baju belum masuk tahap production)*. <br><br>
        Mengabaikan aturan ini akan mengembalikan error 409 Conflict.'
      parameters:
      - description: Order ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: 'Pilihan Status: quotation, pending, production, completed, canceled'
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_faridlan_sikon-api_internal_delivery_http_dto.OrderStatusUpdateRequest'
