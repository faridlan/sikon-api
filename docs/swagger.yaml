      - BearerAuth: []
      summary: Update Payment Status (MANUAL OVERRIDE)
      tags:
      - Orders
  /orders/{id}/status:
    patch:
      consumes:
      - application/json
      description: 'Mengubah status operasional pabrik. Tunduk pada aturan validasi
        State Machine: <br><br> 1. **quotation** -> **pending** <br> 2. **pending**
        -> **production** *(Syarat: Minimal sudah bayar DP / status partial)* <br>
        3. **production** -> **completed** *(Syarat: Status pembayaran harus lunas/paid)*
        <br> 4. **canceled** *(Syarat: Baju belum masuk tahap production)*. <br><br>
        Mengabaikan aturan ini akan mengembalikan error 409 Conflict.'
      parameters:
      - description: Order ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: 'Pilihan Status: quotation, pending, production, completed, canceled'
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_faridlan_sikon-api_internal_delivery_http_dto.OrderStatusUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_faridlan_sikon-api_internal_utils.SuccessResponse-any'
        "400":
          description: Input tidak valid
          schema:
            $ref: '#/definitions/github_com_faridlan_sikon-api_internal_utils.ErrorResponse'
        "404":
          description: Order tidak ditemukan
          schema:
            $ref: '#/definitions/github_com_faridlan_sikon-api_internal_utils.ErrorResponse'
        "409":
          description: Transisi status ditolak oleh State Machine
          schema:
            $ref: '#/definitions/github_com_faridlan_sikon-api_internal_utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_faridlan_sikon-api_internal_utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update Order Status (STATE MACHINE)
      tags:
      - Orders
